<form class="subscribe" action="https://buttondown.com/api/emails/embed-subscribe/jparmet" method="post" target="_blank">
  <label for="subscribe-email">You can get an email when I post!</label>
  <div>
    <input type="email" name="email" id="subscribe-email" placeholder="you@example.com" autocomplete="email" required>
    <input type="hidden" name="embed" value="1">
    <button type="submit">Subscribe</button>
    <small>I promise not to sell your data or spam you with stuff :)</small>
  </div>
</form>

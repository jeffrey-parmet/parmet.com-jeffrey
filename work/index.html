---
layout: default
title: Work
---
{%- include root.html -%}
    <h1>Work</h1>
    <p><a href="resume.pdf" target="_blank" rel="noopener">See my resume</a> (last updated Winter 2026)</p>
    <ul class="cases">
      {% for case in site.projects %}
      <li>
        <a class="thumb" href="{{ case.link }}" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true">{% if case.image %}<img src="{{ root }}img/projects/{{ case.image }}" alt="">{% endif %}</a>
        <h2><a href="{{ case.link }}" target="_blank" rel="noopener">{{ case.title }}</a></h2>
        {{ case.content | markdownify | replace: '<a href="http', '<a target="_blank" rel="noopener" href="http' }}
      </li>
      {% endfor %}
    </ul>

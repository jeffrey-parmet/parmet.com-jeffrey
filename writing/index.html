---
layout: default
title: Writing
---
    <h1>Writing</h1>
    <ul class="posts">
      {% for post in site.posts %}
      <li><a href="{{ post.url | relative_url }}"><time datetime="{{ post.date | date: '%Y-%m-%d' }}">{{ post.date | date: '%b %-d, %Y' }}</time> <span>{{ post.title }}</span></a></li>
      {% endfor %}
    </ul>

{%- include root.html -%}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="Writing by Jeffrey Parmet.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@600;700&family=Lilita+One&family=Playfair:ital,opsz,wght@0,5..1200,400..600;1,5..1200,400&display=swap">
  <link rel="stylesheet" href="{{ root }}style.css">
  <link rel="icon" href="{{ root }}img/icon-32.jpg" sizes="32x32">
  <link rel="apple-touch-icon" href="{{ root }}img/icon-180.jpg">
</head>
<body class="{{ page.body_class }}">
<div class="layout">
  <aside class="sidebar">
    <a class="badge" href="{{ root }}"><img src="{{ root }}img/icon-512.png" alt="Home"></a>
    <a class="name" href="{{ root }}"><span>Jeffrey</span><span>Parmet</span></a>
    <nav>
      <a href="{{ root }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a>
      <a href="{{ root }}writing/"{% if page.url == '/writing/' %} aria-current="page"{% elsif page.layout == 'post' %} aria-current="true"{% endif %}>Chicken Scratch</a>
      <a href="{{ root }}work/"{% if page.url == '/work/' %} aria-current="page"{% endif %}>Work Samples</a>
    </nav>
    <div class="sidebar-foot"><a href="https://github.com/jeffrey-parmet" target="_blank" rel="noopener">GitHub</a> · <a href="https://www.linkedin.com/in/jeffrey-parmet/" target="_blank" rel="noopener">Linkedin</a></div>
  </aside>

  <main>
{{ content }}
  </main>
</div>
  <script data-goatcounter="https://jparmet.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
